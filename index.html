<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img src="sign up now.svg" alt="Sign Up Button">

    <!-- Footer -->
  <footer>
    <div class="social-icons">
      <a href="https://twitter.com" target="_blank" aria-label="X (Twitter)">
        <!-- X icon -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="black" width="32" height="32">
          <rect width="32" height="32" rx="6" fill="#ffcc00"/>
          <path stroke="black" stroke-width="2" d="M7 7l10 10m0-10L7 17"/>
        </svg>
      </a>

      <a href="https://tiktok.com" target="_blank" aria-label="TikTok">
        <!-- TikTok icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <rect width="32" height="32" rx="6" fill="#ffcc00"/>
          <path d="M12 3c1.5 2 3 3 5 3v3c-2 0-3.5-.5-5-2v7a5 5 0 11-5-5h1v3h-1a2 2 0 102 2V3z" fill="black"/>
        </svg>
      </a>

      <a href="https://instagram.com" target="_blank" aria-label="Instagram">
        <!-- Instagram icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <rect width="32" height="32" rx="6" fill="#ffcc00"/>
          <circle cx="12" cy="12" r="4" stroke="black" stroke-width="2"/>
          <circle cx="17" cy="7" r="1.5" fill="black"/>
        </svg>
      </a>

      <a href="https://youtube.com" target="_blank" aria-label="YouTube">
        <!-- YouTube icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <circle cx="16" cy="16" r="16" fill="#ffcc00"/>
          <polygon points="10,8 18,12 10,16" fill="black"/>
        </svg>
      </a>

      <a href="https://t.me" target="_blank" aria-label="Telegram">
        <!-- Telegram icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <rect width="32" height="32" rx="6" fill="#ffcc00"/>
          <path d="M6 12l12-6-3 12-3-4-4 3z" fill="black"/>
        </svg>
      </a>
    </div>
  </footer>

</body>
</html>
